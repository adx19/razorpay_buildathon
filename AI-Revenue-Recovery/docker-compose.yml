services:
  backend:
    build: ./backend
    container_name: ai-revenue-recovery-backend
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai-revenue-recovery-frontend
    ports:
      - "5173:80"
    restart: unless-stopped